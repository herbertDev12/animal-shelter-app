version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: animal-shelter-db
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      # The schema is owned by Prisma migrations now (apps/api/prisma), so the
      # container no longer bootstraps itself from SQL files.
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
